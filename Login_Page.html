<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>MH STUDIOS | ACCESS CONTROL</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="icon" type="image/x-icon" href="images/Logo_1.png">
    
    <style>
        /* CORE THEME */
        :root { --mh-blue: #0080FF; --mh-orange: #ffae00; --mh-dark: #05070a; }
        body { background-color: var(--mh-dark); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* HEADER & FOOTER (Minimal) */
        #access-header { padding: 15px 30px; background: rgba(0,0,0,0.8); display: flex; justify-content: space-between; border-bottom: 1px solid #333; z-index: 10; }
        #access-footer { padding: 15px; text-align: center; background: rgba(0,0,0,0.9); border-top: 1px solid #333; z-index: 10; }
        
        /* CARD */
        #terminal-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; z-index: 5; }
        .access-card { width: 450px; background: rgba(13, 17, 23, 0.95); border: 1px solid #333; padding: 30px; border-radius: 6px; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        
        /* TABS */
        .ops-tabs { display: flex; border-bottom: 2px solid #333; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 15px; background: none; border: none; color: #666; font-family: 'Uni Sans', sans-serif; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: #fff; border-bottom: 2px solid var(--mh-blue); background: rgba(0,128,255,0.1); }
        
        /* ROLE TOGGLE (THE NEW FEATURE) */
        .role-switch { display: flex; margin-bottom: 20px; background: #000; border: 1px solid #333; border-radius: 4px; overflow: hidden; }
        .role-opt { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #666; font-size: 0.8em; transition: 0.3s; font-weight: bold; }
        .role-opt:hover { color: #fff; }
        
        /* Active States */
        .role-opt.active-student { background: var(--mh-blue); color: #000; }
        .role-opt.active-merc { background: var(--mh-orange); color: #000; }

        /* INPUTS */
        .titan-field { width: 100%; padding: 12px; margin-bottom: 15px; background: #0b0e11; border: 1px solid #333; color: #fff; border-radius: 4px; }
        .titan-field:focus { border-color: #fff; }
        
        /* BUTTONS */
        .cmd-btn { width: 100%; padding: 15px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-login { background: var(--mh-blue); color: #000; }
        .btn-reg { background: #333; color: #fff; transition: 0.3s; }
        
        /* ALERTS */
        #sys-alert { display: none; color: #ff004c; text-align: center; margin-bottom: 15px; font-size: 0.9em; }
    </style>
</head>
<body>

    <header id="access-header">
        <div style="color:#fff; font-weight:bold;"><img src="images/Logo_1.png" style="height:30px; vertical-align:middle;"> ACCESS CONTROL</div>
        <a href="index.html" style="color:#666; text-decoration:none; font-size:0.8em;">ABORT</a>
    </header>

    <div id="terminal-wrapper">
        <div class="access-card">
            <div id="sys-alert">ERROR</div>

            <div class="ops-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">LOGIN</button>
                <button class="tab-btn" onclick="switchTab('register')">REGISTER</button>
            </div>

            <div id="panel-login">
                <form id="form-login">
                    <input type="email" id="log-email" class="titan-field" placeholder="EMAIL" required>
                    <input type="password" id="log-pass" class="titan-field" placeholder="PASSWORD" required>
                    <button type="submit" id="btn-login" class="cmd-btn btn-login">AUTHENTICATE</button>
                </form>
                <div style="text-align:center; margin-top:15px;">
                    <button class="titan-field" id="btn-google-login" style="background:#fff; color:#000; border:none;">
                        <i class="fab fa-google"></i> LOGIN WITH GOOGLE
                    </button>
                </div>
            </div>

            <div id="panel-register" style="display:none;">
                
                <div class="role-switch">
                    <div class="role-opt active-student" id="opt-student" onclick="setRole('student')">
                        <i class="fas fa-graduation-cap"></i> STUDENT
                    </div>
                    <div class="role-opt" id="opt-merc" onclick="setRole('freelancer')">
                        <i class="fas fa-crosshairs"></i> FREELANCER
                    </div>
                </div>

                <form id="form-register">
                    <input type="text" id="reg-name" class="titan-field" placeholder="FULL NAME" required>
                    <input type="email" id="reg-email" class="titan-field" placeholder="EMAIL" required>
                    <input type="password" id="reg-pass" class="titan-field" placeholder="CREATE PASSWORD" required>
                    <button type="submit" id="btn-register" class="cmd-btn btn-reg" style="background:var(--mh-blue);">JOIN AS STUDENT</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, DB_PATH } from './assets/js/firebase-init.js';
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
        import { doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

        let selectedRole = 'student';

        // 1. UI SWITCHING
        window.switchTab = (tab) => {
            document.getElementById('sys-alert').style.display = 'none';
            if(tab === 'login') {
                document.getElementById('panel-login').style.display = 'block';
                document.getElementById('panel-register').style.display = 'none';
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.remove('active');
            } else {
                document.getElementById('panel-login').style.display = 'none';
                document.getElementById('panel-register').style.display = 'block';
                document.querySelectorAll('.tab-btn')[0].classList.remove('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
        };

        // 2. ROLE SELECTION LOGIC
        window.setRole = (role) => {
            selectedRole = role;
            const btn = document.getElementById('btn-register');
            const studentOpt = document.getElementById('opt-student');
            const mercOpt = document.getElementById('opt-merc');

            if(role === 'student') {
                studentOpt.classList.add('active-student');
                mercOpt.classList.remove('active-merc');
                btn.innerText = "JOIN AS STUDENT";
                btn.style.background = "var(--mh-blue)";
                btn.style.color = "#000";
            } else {
                mercOpt.classList.add('active-merc');
                studentOpt.classList.remove('active-student');
                btn.innerText = "JOIN AS MERCENARY";
                btn.style.background = "var(--mh-orange)";
                btn.style.color = "#000";
            }
        };

        // 3. LOGIN EXECUTION
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const email = document.getElementById('log-email').value;
            const pass = document.getElementById('log-pass').value;

            btn.innerText = "VERIFYING...";
            try {
                const cred = await signInWithEmailAndPassword(auth, email, pass);
                await routeUser(cred.user);
            } catch(e) {
                document.getElementById('sys-alert').style.display = 'block';
                document.getElementById('sys-alert').innerText = "ERROR: " + e.message;
                btn.innerText = "AUTHENTICATE";
            }
        });

        // 4. REGISTER EXECUTION (THE CRITICAL PART)
        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-register');
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;

            btn.innerText = "CREATING ID...";
            
            try {
                // A. Create Auth
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(cred.user, { displayName: name });

                // B. Create DB Profile WITH SELECTED ROLE
                const userRef = doc(db, `${DB_PATH}/users/${cred.user.uid}`);
                
                // Base Data
                let dossier = {
                    uid: cred.user.uid,
                    email: email,
                    name: name,
                    role: selectedRole, // THIS IS THE KEY
                    wallet_balance: 0,
                    createdAt: serverTimestamp(),
                    checkpoint: 1 // Send to Registration Form
                };

                // Specific Logic
                if (selectedRole === 'freelancer') {
                    dossier.tier = 'MERCENARY'; // Fast Track
                    dossier.status = 'ACTIVE';    // Instant Access
                    dossier.clearance = 'PROBATION'; 
                    dossier.checkpoint = 4; // Skip Form? No, let's make them fill phone number in form.
                    // Actually, let's send ALL to Form to get Phone Number
                }

                await setDoc(userRef, dossier);

                // C. Route
                window.location.href = 'User_Registeration_Form.html'; // Everyone goes here to finish Phone/Uni info

            } catch(e) {
                document.getElementById('sys-alert').style.display = 'block';
                document.getElementById('sys-alert').innerText = e.message;
                btn.innerText = "TRY AGAIN";
            }
        });

        // 5. ROUTER
        async function routeUser(user) {
            const snap = await getDoc(doc(db, `${DB_PATH}/users/${user.uid}`));
            if(snap.exists()) {
                const data = snap.data();
                if(data.checkpoint < 4) window.location.href = 'User_Registeration_Form.html';
                else if(data.role === 'freelancer') window.location.href = 'Freelancers_Room.html';
                else window.location.href = 'Student_Room.html';
            } else {
                // Fallback for Google Users (Default to Student)
                window.location.href = 'User_Registeration_Form.html';
            }
        }
    </script>
</body>
</html>
