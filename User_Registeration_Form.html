<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>MH STUDIOS | DOSSIER CREATION</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="icon" type="image/x-icon" href="images/Logo_1.png">
    
    <style>
        /* TITAN FORM THEME */
        :root {
            --titan-blue: #0080FF;
            --titan-orange: #ffae00;
            --titan-dark: #05070a;
            --titan-panel: rgba(13, 17, 23, 0.95);
        }

        body {
            background-color: var(--titan-dark);
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('images/bg_tactical.jpg');
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Uni Sans', sans-serif;
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .dossier-card {
            width: 100%; max-width: 600px;
            background: var(--titan-panel);
            border: 1px solid #333;
            border-top: 3px solid var(--titan-blue); /* Default Blue */
            padding: 40px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            position: relative;
            animation: slideUp 0.6s ease-out;
        }

        /* DYNAMIC THEME COLORS */
        .theme-student { border-top-color: var(--titan-blue); }
        .theme-student h2, .theme-student .highlight { color: var(--titan-blue); }
        .theme-student .action-btn { background: var(--titan-blue); color: #000; }

        .theme-merc { border-top-color: var(--titan-orange); }
        .theme-merc h2, .theme-merc .highlight { color: var(--titan-orange); }
        .theme-merc .action-btn { background: var(--titan-orange); color: #000; }

        h2 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .full-width { grid-column: span 2; }

        .titan-group label { display: block; font-size: 0.75em; color: #888; margin-bottom: 8px; letter-spacing: 1px; }
        .titan-input {
            width: 100%; padding: 12px;
            background: #0b0e11; border: 1px solid #333;
            color: #fff; border-radius: 4px; outline: none; transition: 0.3s;
        }
        .titan-input:focus { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.1); }

        .action-btn {
            width: 100%; padding: 15px; border: none; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
            transition: 0.3s; margin-top: 20px;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }
        .action-btn:hover { filter: brightness(1.2); }

        /* CONDITIONAL SECTIONS */
        .role-section { display: none; }
        .role-section.active { display: block; animation: fadeIn 0.5s; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
		
		/* --- INSERT THIS INTO YOUR (STYLE) --- */
		/* FILE UPLOAD ZONE */
		.upload-zone {
			border: 2px dashed #333;
			background: rgba(0,0,0,0.3);
			padding: 20px;
			text-align: center;
			cursor: pointer;
			transition: 0.3s;
			border-radius: 4px;
			color: #666;
		}
		.upload-zone:hover {
			border-color: #fff;
			color: #fff;
			background: rgba(255,255,255,0.05);
		}
		.upload-zone.file-selected {
			border-color: var(--titan-green, #00ff41);
			color: var(--titan-green, #00ff41);
			background: rgba(0, 255, 65, 0.05);
		}

		/* WRONG ROLE SWITCHER */
		.switch-link {
			display: block;
			text-align: center;
			margin-top: 15px;
			font-size: 0.75em;
			color: #666;
			text-decoration: none;
			cursor: pointer;
			transition: 0.3s;
		}
		.switch-link:hover { color: #fff; }

        /* MOBILE */
        @media (max-width: 600px) { .input-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
    </style>
</head>
<body>
    <div class="dossier-card theme-student" id="main-card">
        <h2 id="form-title">
            <span><i class="fas fa-file-contract"></i> DOSSIER INITIALIZATION</span>
            <span style="font-size:0.6em; opacity:0.7;" id="role-badge">RECRUIT</span>
        </h2>

        <form id="dossier-form">
            
            <div class="input-grid">
                <div class="titan-group">
                    <label>FIRST NAME</label>
                    <input type="text" id="core-fname" class="titan-input" placeholder="REQUIRED" required>
                </div>
                <div class="titan-group">
                    <label>LAST NAME</label>
                    <input type="text" id="core-lname" class="titan-input" placeholder="REQUIRED" required>
                </div>
				
				<div class="titan-group">
                    <label>GENDER</label>
					<select id="std-gender" class="titan-select">
						<option value="Male">Male</option>
						<option value="Female">Female</option>
					</select>
                </div>
                <div class="titan-group full-width">
                    <label>CONTACT UPLINK (PHONE)</label>
                    <input type="tel" id="core-phone" class="titan-input" placeholder="+962 7X XXX XXXX" required>
                </div>
                <div class="titan-group">
                    <label>OPERATIVE AGE</label>
                    <input type="number" id="core-age" class="titan-input" placeholder="YEARS" required>
                </div>
                <div class="titan-group">
                    <label>BASE LOCATION</label>
                    <input type="text" id="core-loc" class="titan-input" placeholder="CITY, COUNTRY" required>
                </div>
            </div>

            <div id="section-student" class="role-section">
                <div style="margin-bottom:15px; border-left:3px solid var(--titan-blue); padding-left:15px;">
                    <p style="margin:0; color:var(--titan-blue); font-size:0.9em;">ACADEMIC PROFILE</p>
                </div>
                <div class="input-grid">
                    <div class="titan-group full-width">
                        <label>UNIVERSITY / INSTITUTION</label>
						<select id="std-uni" class="titan-select">
							<option value="Middle East University">Middle East University (MEU)</option>
							<option value="University of Jordan">University of Jordan (UJ)</option>
							<option value="Jordan University of Science and Technology">JUST</option>
							<option value="Hashemite University">Hashemite University</option>
							<option value="Princess Sumaya University">Princess Sumaya (PSUT)</option>
							<option value="German Jordanian University">GJU</option>
							<option value="Al-Zarqa University">Al-Zarqa University</option>
							<option value="Al-Balqa Applied University">Al-Balqa (BAU)</option>
							<option value="Mutah University">Mutah University</option>
							<option value="Other">Other / Not Listed</option>
						</select>
                    </div>
					<div class="titan-group full-width">
                        <label>NATIONALITY</label>
						<select id="std-nat" class="titan-select">
							<option value="Jordan">Jordan</option>
							<option value="Palestine">Palestine</option>
							<option value="Syria">Syria</option>
							<option value="Iraq">Iraq</option>
							<option value="Lebanon">Lebanon</option>
							<option value="Egypt">Egypt</option>
							<option value="Saudi Arabia">Saudi Arabia</option>
							<option value="Kuwait">Kuwait</option>
							<option value="Qatar">Qatar</option>
							<option value="UAE">UAE</option>
							<option value="Oman">Oman</option>
							<option value="Yemen">Yemen</option>
							<option value="Bahrain">Bahrain</option>
							<option value="Israel">Israel</option>
							<option value="Iran">Iran</option>
							<option value="Other">Other (International)</option>
						</select>
                    </div>
                    <div class="titan-group full-width">
                        <label>MAJOR / SPECIALIZATION</label>
                        <input type="text" id="std-major" class="titan-input" placeholder="e.g. Computer Science">
                    </div>
                    <div class="titan-group full-width">
                        <label>EDUCATION LEVEL</label>
                        <select id="std-lvl" class="titan-input">
                            <option value="univ">Undergraduate (Bachelors)</option>
                            <option value="grad">Postgraduate (Masters/PhD)</option>
                            <option value="hs">High School</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="section-merc" class="role-section">
                <div style="margin-bottom:15px; border-left:3px solid var(--titan-orange); padding-left:15px;">
                    <p style="margin:0; color:var(--titan-orange); font-size:0.9em;">OPERATOR PROFILE</p>
                </div>
                <div class="input-grid">
                    <div class="titan-group full-width">
                        <label>AFFILIATED COMPANY (OPTIONAL)</label>
                        <input type="text" id="ops-comp" class="titan-input" placeholder="LEAVE EMPTY IF FREELANCE">
                    </div>
                    <div class="titan-group">
                        <label>EDUCATION LEVEL</label>
                        <select id="ops-lvl" class="titan-input">
                            <option value="grad">Graduate (Expert)</option>
                            <option value="univ">University Student</option>
                            <option value="none">Self-Taught</option>
                        </select>
                    </div>
                    <div class="titan-group">
                        <label>PRIMARY SKILL</label>
                        <input type="text" id="ops-skill" class="titan-input" placeholder="e.g. PYTHON">
                    </div>
                </div>
            </div>
			
			<div class="input-grid">
				<div class="titan-group full-width">
					<label>ID VERIFICATION / CREDENTIALS (OPTIONAL)</label>
					<div class="upload-zone" onclick="document.getElementById('id-file').click()">
						<i class="fas fa-id-card" style="font-size:1.5em; margin-bottom:10px;"></i><br>
						<span id="file-label">CLICK TO UPLOAD ID OR PASSPORT</span>
						<input type="file" id="id-file" hidden onchange="updateFileLabel(this)">
					</div>
				</div>
			</div>

            <button type="submit" id="btn-submit" class="action-btn">CONFIRM INTEL</button>
        </form>

    </div>
	<script type="module">
		// 1. IMPORT CENTRALIZED FIREBASE & GENERATOR
		import { auth, db, dbID } from './assets/js/firebase-init.js';
		import { doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
		import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
		import { generateTitanID } from './assets/js/id-generator.js';

		// GLOBAL INTELLIGENCE
		let currentUid = "";
		let currentRole = "";

		// 2. INITIALIZE & DETECT ROLE
		onAuthStateChanged(auth, async (user) => {
			if (user) {
				console.log("OPERATIVE DETECTED:", user.uid);
				currentUid = user.uid;

				// A. FETCH THE DOSSIER CREATED BY DOD_LOGIN
				const userRef = doc(db, "users", currentUid);
				const userSnap = await getDoc(userRef);

				if (userSnap.exists()) {
					const data = userSnap.data();
					currentRole = data.role ? data.role.toLowerCase() : "";
					console.log("ROLE IDENTIFIED:", currentRole);

					// B. REVEAL THE CORRECT FIELDS AUTOMATICALLY
					if (currentRole === 'student') {
						// Update Badge
						document.getElementById('role-badge').innerText = "STUDENT";
						// Apply Blue Theme
						document.querySelector('.dossier-card').classList.add('theme-student');
						// Show Student Section
						document.getElementById('section-student').classList.add('active');
					} 
					else if (currentRole === 'freelancer') {
						// Update Badge
						document.getElementById('role-badge').innerText = "MERCENARY";
						// Apply Orange Theme
						const card = document.getElementById('main-card');
						card.classList.remove('theme-student');
						card.classList.add('theme-merc');
						// Show Merc Section
						document.getElementById('section-merc').classList.add('active');
					}
				} else {
					console.error("NO DOSSIER FOUND.");
					// Optional: Force logout if no doc exists
				}
			} else {
				// Not logged in? Return to Base
				window.location.href = "DoD_Login_Style.html";
			}
		});

		// 3. THE PAYLOAD: SAVE DATA
		document.getElementById('btn-submit').addEventListener('click', async (e) => {
			e.preventDefault(); // Stop page reload

			const btn = document.getElementById('btn-submit');
			btn.innerText = "ENCRYPTING ID...";
			btn.disabled = true;

			try {
				// A. COLLECT RAW DATA FOR ID GENERATION
				// We map the HTML IDs to the generator's expected keys
				const rawData = {
					role: currentRole,
					gender: document.getElementById('std-gender').value,
					nationality: document.getElementById('std-nat').value,
					university: document.getElementById('std-uni').value,
					education_level: document.getElementById('std-lvl')?.value || "University"
				};

				// B. GENERATE THE TITAN SERIAL
				const titanSerial = generateTitanID(rawData);
				console.log("GENERATED SERIAL:", titanSerial);

				// C. PREPARE THE UPDATE OBJECT
				// We map the HTML IDs to the Database Fields
				let updateData = {
					titanId: titanSerial, // <--- SAVING THE ID
					first_name: document.getElementById('core-fname').value,
					last_name: document.getElementById('core-lname').value,
					phone: document.getElementById('core-phone').value,
					age: document.getElementById('core-age').value,
					location: document.getElementById('core-loc').value,
					
					gender: rawData.gender,
					nationality: rawData.nationality,
					
					profile_completed: true,
					checkpoint: 2,
					updated_at: serverTimestamp()
				};

				// D. INJECT ROLE SPECIFIC DATA
				if (currentRole === 'student') {
					updateData.education_profile = {
						university: rawData.university,
						major: document.getElementById('std-major').value,
						education_level: rawData.education_level
					};
					// Save root level for searching
					updateData.university = rawData.university;
				} 
				else if (currentRole === 'freelancer') {
					// Generate a random contract ID for flavor
					const opID = "OPS-" + Math.floor(Math.random() * 9000 + 1000);
					updateData.operational_data = {
						contract_id: opID,
						company: document.getElementById('ops-comp').value || "FREELANCE",
						specialty: document.getElementById('ops-skill').value,
						education_level: document.getElementById('ops-lvl').value,
						ops_type: "MERCENARY"
					};
				}

				// E. EXECUTE DATABASE UPDATE
				const userRef = doc(db, 'artifacts', dbID, 'users', currentUid);
				await updateDoc(userRef, updateData);

				alert(`IDENTITY CONFIRMED.\n\nYOUR SERIAL NUMBER ASSIGNED:\n${titanSerial}`);
				
				// F. REDIRECT
				if (currentRole === 'student') window.location.href = "Terms_Conditions.html?mode=induction";
				else window.location.href = "Freelancers_Room.html";

			} catch (e) {
				console.error(e);
				alert("ERROR: " + e.message);
				btn.innerText = "CONFIRM INTEL";
				btn.disabled = false;
			}
		});

		// Helper for file upload visual
		window.updateFileLabel = (input) => {
			if(input.files && input.files[0]) {
				document.getElementById('file-label').innerText = "SECURED: " + input.files[0].name;
				document.querySelector('.upload-zone').classList.add('file-selected');
			}
		};
	</script>
</body>
</html>
