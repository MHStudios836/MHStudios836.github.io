<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>MH STUDIOS | DOSSIER CREATION</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="icon" type="image/x-icon" href="images/Logo_1.png">
    
    <style>
        /* TITAN FORM THEME */
        :root {
            --titan-blue: #0080FF;
            --titan-orange: #ffae00;
            --titan-dark: #05070a;
            --titan-panel: rgba(13, 17, 23, 0.95);
        }

        body {
            background-color: var(--titan-dark);
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('images/bg_tactical.jpg');
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Uni Sans', sans-serif;
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .dossier-card {
            width: 100%; max-width: 600px;
            background: var(--titan-panel);
            border: 1px solid #333;
            border-top: 3px solid var(--titan-blue); /* Default Blue */
            padding: 40px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            position: relative;
            animation: slideUp 0.6s ease-out;
        }

        /* DYNAMIC THEME COLORS */
        .theme-student { border-top-color: var(--titan-blue); }
        .theme-student h2, .theme-student .highlight { color: var(--titan-blue); }
        .theme-student .action-btn { background: var(--titan-blue); color: #000; }

        .theme-merc { border-top-color: var(--titan-orange); }
        .theme-merc h2, .theme-merc .highlight { color: var(--titan-orange); }
        .theme-merc .action-btn { background: var(--titan-orange); color: #000; }

        h2 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .full-width { grid-column: span 2; }

        .titan-group label { display: block; font-size: 0.75em; color: #888; margin-bottom: 8px; letter-spacing: 1px; }
        .titan-input {
            width: 100%; padding: 12px;
            background: #0b0e11; border: 1px solid #333;
            color: #fff; border-radius: 4px; outline: none; transition: 0.3s;
        }
        .titan-input:focus { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.1); }

        .action-btn {
            width: 100%; padding: 15px; border: none; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
            transition: 0.3s; margin-top: 20px;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }
        .action-btn:hover { filter: brightness(1.2); }

        /* CONDITIONAL SECTIONS */
        .role-section { display: none; }
        .role-section.active { display: block; animation: fadeIn 0.5s; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
		
		/* --- INSERT THIS INTO YOUR (STYLE) --- */
		/* FILE UPLOAD ZONE */
		.upload-zone {
			border: 2px dashed #333;
			background: rgba(0,0,0,0.3);
			padding: 20px;
			text-align: center;
			cursor: pointer;
			transition: 0.3s;
			border-radius: 4px;
			color: #666;
		}
		.upload-zone:hover {
			border-color: #fff;
			color: #fff;
			background: rgba(255,255,255,0.05);
		}
		.upload-zone.file-selected {
			border-color: var(--titan-green, #00ff41);
			color: var(--titan-green, #00ff41);
			background: rgba(0, 255, 65, 0.05);
		}

		/* WRONG ROLE SWITCHER */
		.switch-link {
			display: block;
			text-align: center;
			margin-top: 15px;
			font-size: 0.75em;
			color: #666;
			text-decoration: none;
			cursor: pointer;
			transition: 0.3s;
		}
		.switch-link:hover { color: #fff; }

        /* MOBILE */
        @media (max-width: 600px) { .input-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
    </style>
</head>
<body>

    <div class="dossier-card theme-student" id="main-card">
        <h2 id="form-title">
            <span><i class="fas fa-file-contract"></i> DOSSIER INITIALIZATION</span>
            <span style="font-size:0.6em; opacity:0.7;" id="role-badge">RECRUIT</span>
        </h2>

        <form id="dossier-form">
            
            <div class="input-grid">
                <div class="titan-group">
                    <label>FIRST NAME</label>
                    <input type="text" id="core-fname" class="titan-input" placeholder="REQUIRED" required>
                </div>
                <div class="titan-group">
                    <label>LAST NAME</label>
                    <input type="text" id="core-lname" class="titan-input" placeholder="REQUIRED" required>
                </div>
                <div class="titan-group full-width">
                    <label>CONTACT UPLINK (PHONE)</label>
                    <input type="tel" id="core-phone" class="titan-input" placeholder="+962 7X XXX XXXX" required>
                </div>
                <div class="titan-group">
                    <label>OPERATIVE AGE</label>
                    <input type="number" id="core-age" class="titan-input" placeholder="YEARS" required>
                </div>
                <div class="titan-group">
                    <label>BASE LOCATION</label>
                    <input type="text" id="core-loc" class="titan-input" placeholder="CITY, COUNTRY" required>
                </div>
            </div>

            <div id="section-student" class="role-section">
                <div style="margin-bottom:15px; border-left:3px solid var(--titan-blue); padding-left:15px;">
                    <p style="margin:0; color:var(--titan-blue); font-size:0.9em;">ACADEMIC PROFILE</p>
                </div>
                <div class="input-grid">
                    <div class="titan-group full-width">
                        <label>UNIVERSITY / INSTITUTION</label>
                        <select id="std-uni" class="titan-input">
                            <option value="JUST">JUST (Jordan Univ. of Science & Tech)</option>
                            <option value="UOY">University of Yarmouk</option>
                            <option value="UJ">University of Jordan</option>
                            <option value="PSUT">PSUT (Princess Sumaya)</option>
                            <option value="HU">Hashemite University</option>
                            <option value="OTHER">Other Institution</option>
                        </select>
                    </div>
                    <div class="titan-group full-width">
                        <label>MAJOR / SPECIALIZATION</label>
                        <input type="text" id="std-major" class="titan-input" placeholder="e.g. Computer Science">
                    </div>
                    <div class="titan-group full-width">
                        <label>EDUCATION LEVEL</label>
                        <select id="std-lvl" class="titan-input">
                            <option value="univ">Undergraduate (Bachelors)</option>
                            <option value="grad">Postgraduate (Masters/PhD)</option>
                            <option value="hs">High School</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="section-merc" class="role-section">
                <div style="margin-bottom:15px; border-left:3px solid var(--titan-orange); padding-left:15px;">
                    <p style="margin:0; color:var(--titan-orange); font-size:0.9em;">OPERATOR PROFILE</p>
                </div>
                <div class="input-grid">
                    <div class="titan-group full-width">
                        <label>AFFILIATED COMPANY (OPTIONAL)</label>
                        <input type="text" id="ops-comp" class="titan-input" placeholder="LEAVE EMPTY IF FREELANCE">
                    </div>
                    <div class="titan-group">
                        <label>EDUCATION LEVEL</label>
                        <select id="ops-lvl" class="titan-input">
                            <option value="grad">Graduate (Expert)</option>
                            <option value="univ">University Student</option>
                            <option value="none">Self-Taught</option>
                        </select>
                    </div>
                    <div class="titan-group">
                        <label>PRIMARY SKILL</label>
                        <input type="text" id="ops-skill" class="titan-input" placeholder="e.g. PYTHON">
                    </div>
                </div>
            </div>
			
			<div class="input-grid">
				<div class="titan-group full-width">
					<label>ID VERIFICATION / CREDENTIALS (OPTIONAL)</label>
					<div class="upload-zone" onclick="document.getElementById('id-file').click()">
						<i class="fas fa-id-card" style="font-size:1.5em; margin-bottom:10px;"></i><br>
						<span id="file-label">CLICK TO UPLOAD ID OR PASSPORT</span>
						<input type="file" id="id-file" hidden onchange="updateFileLabel(this)">
					</div>
				</div>
			</div>

            <button type="submit" id="btn-submit" class="action-btn">CONFIRM INTEL</button>
        </form>

    </div>

	<script type="module">
		// 1. IMPORT FIREBASE LIBRARIES
		import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
		import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
		import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

		// 2. CONFIGURE YOUR SATELLITE (Replace with your actual Firebase Config keys)
		const firebaseConfig = {
			apiKey: "YOUR_API_KEY",
			authDomain: "mhstudios-836.firebaseapp.com",
			projectId: "mhstudios-836",
			storageBucket: "mhstudios-836.appspot.com",
			messagingSenderId: "YOUR_SENDER_ID",
			appId: "YOUR_APP_ID"
		};

		const app = initializeApp(firebaseConfig);
		const auth = getAuth(app);
		const db = getFirestore(app);

		// GLOBAL VARIABLES
		let currentUid = "";
		let currentEmail = "";
		let currentRole = "";

		// 3. INITIALIZE: LISTEN FOR USER
		onAuthStateChanged(auth, (user) => {
			if (user) {
				console.log("OPERATIVE IDENTIFIED:", user.email);
				currentUid = user.uid;
				currentEmail = user.email;
				
				// Note: In a real app, we might fetch their existing partial role here
				// For now, we wait for them to select the role in the form
			} else {
				// No user logged in? Kick them back to Login
				window.location.href = "DoD_Login_Style.html";
			}
		});

		// 4. UI LOGIC: TOGGLE FORMS
		window.selectRole = function(role) {
			currentRole = role;
			
			// Visual Selection Logic
			document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
			document.getElementById(`card-${role}`).classList.add('active');

			// Show Specific Form Fields
			document.getElementById('student-fields').style.display = (role === 'student') ? 'block' : 'none';
			document.getElementById('freelancer-fields').style.display = (role === 'freelancer') ? 'block' : 'none';
			
			// Show Submit Button
			document.getElementById('action-area').style.display = 'block';
		}

		// 5. THE PAYLOAD: SAVE DATA TO FIRESTORE
		document.getElementById('btn-save-dossier').addEventListener('click', async () => {
			const btn = document.getElementById('btn-save-dossier');
			btn.innerText = "UPLOADING TO MAINFRAME...";
			btn.disabled = true;

			try {
				// A. PREPARE THE "UNIFIED CORE" (Shared Data)
				// This is the "JSON" you were worried about. The code builds it here.
				let userProfile = {
					uid: currentUid,
					email: currentEmail,
					role: currentRole.toUpperCase(), // "STUDENT" or "FREELANCER"
					first_name: document.getElementById('inp-fname').value,
					last_name: document.getElementById('inp-lname').value,
					username: document.getElementById('inp-username').value,
					phone: document.getElementById('inp-phone').value,
					age: document.getElementById('inp-age').value,
					location: document.getElementById('inp-location').value,
					
					// Default System Flags
					is_banned: false,
					is_online: true,
					wallet_balance: 0.00,
					created_at: serverTimestamp()
				};

				// B. INJECT SPECIFIC DATA (The DNA Split)
				if (currentRole === 'student') {
					userProfile.education_profile = {
						university: document.getElementById('std-uni').value,
						major: document.getElementById('std-major').value,
						education_level: document.getElementById('std-lvl').value
					};
					userProfile.missions_created = 0;
				} 
				else if (currentRole === 'freelancer') {
					// Generate a random Operator ID
					const opID = "OPS-" + Math.floor(Math.random() * 9000 + 1000);
					
					userProfile.operational_data = {
						contract_id: opID,
						company: document.getElementById('ops-comp').value || "FREELANCE",
						specialty: document.getElementById('ops-skill').value,
						education_level: document.getElementById('ops-lvl').value,
						ops_type: "MERCENARY"
					};
					userProfile.tier = "TIER_1";
					userProfile.rating = 5.0;
				}

				// C. WRITE TO FIREBASE (The actual save)
				// This writes to collection "users" -> document "UID"
				await setDoc(doc(db, "users", currentUid), userProfile);

				// D. SUCCESS & REDIRECT (The Consciousness Trigger)
				console.log("DOSSIER UPLOADED.");
				
				if (currentRole === 'student') {
					// Trigger the Induction Protocol we discussed
					window.location.href = "Terms_Conditions.html?mode=induction";
				} else {
					// Freelancers might skip induction or go to a different onboarding
					window.location.href = "Freelancers_Room.html";
				}

			} catch (error) {
				console.error("UPLOAD FAILED:", error);
				btn.innerText = "RETRY TRANSMISSION";
				btn.disabled = false;
				alert("ERROR: " + error.message);
			}
		});
	</script>
</body>
</html>
