<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>MH STUDIOS | INTELLIGENCE DOSSIER</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="robots" content="noindex" />
    
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="icon" type="image/x-icon" href="images/Logo_1.png">
    
    <style>
        /* =========================================
           THEME: TITAN INTEL (HOLOGRAPHIC BLUE)
           ========================================= */
        :root {
            --intel-bg: #020406;
            --intel-panel: rgba(10, 20, 30, 0.95);
            --intel-blue: #0080FF;
            --intel-cyan: #00e5ff;
            --intel-dim: rgba(0, 229, 255, 0.1);
            --intel-text: #e0e0e0;
        }

        body {
            background-color: var(--intel-bg);
            background-image: 
                linear-gradient(rgba(0, 128, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 128, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--intel-text);
            font-family: 'Segoe UI', monospace;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- THE DOSSIER CARD --- */
        .dossier-frame {
            width: 90%;
            max-width: 1000px;
            background: var(--intel-panel);
            border: 1px solid var(--intel-blue);
            box-shadow: 0 0 30px rgba(0, 128, 255, 0.2);
            position: relative;
            padding: 40px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
        }

        /* CORNER ACCENTS */
        .dossier-frame::before {
            content: ''; position: absolute; top: -1px; left: -1px;
            width: 30px; height: 30px;
            border-top: 3px solid var(--intel-cyan);
            border-left: 3px solid var(--intel-cyan);
        }
        .dossier-frame::after {
            content: ''; position: absolute; bottom: -1px; right: -1px;
            width: 30px; height: 30px;
            border-bottom: 3px solid var(--intel-cyan);
            border-right: 3px solid var(--intel-cyan);
        }

        /* --- COL 1: IDENTITY --- */
        .id-sector { text-align: center; }
        
        .avatar-frame {
            width: 200px; height: 200px;
            margin: 0 auto 20px auto;
            border: 2px solid var(--intel-cyan);
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 20px var(--intel-dim);
        }
        .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 10px;
            background: rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 10px var(--intel-cyan);
            animation: scan 3s infinite linear;
        }

        .rank-badge {
            background: var(--intel-dim);
            color: var(--intel-cyan);
            padding: 5px 15px;
            border: 1px solid var(--intel-blue);
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- COL 2: DATA RECORDS --- */
        .data-sector h1 {
            margin: 0 0 10px 0;
            color: #fff;
            font-size: 2.5em;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--intel-blue);
        }
        .uid-sub {
            color: #666; font-size: 0.8em; margin-bottom: 30px; display: block;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-box {
            background: #000;
            border: 1px solid #333;
            padding: 15px;
            text-align: center;
        }
        .stat-val { font-size: 1.5em; color: #fff; font-weight: bold; }
        .stat-label { color: #888; font-size: 0.7em; letter-spacing: 1px; }

        .bio-box {
            background: rgba(0,0,0,0.3);
            border-left: 3px solid var(--intel-blue);
            padding: 15px;
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 30px;
            min-height: 80px;
        }

        /* --- ACTIONS --- */
        .action-bar { display: flex; gap: 10px; }
        
        .intel-btn {
            flex: 1;
            padding: 15px;
            border: 1px solid var(--intel-blue);
            background: transparent;
            color: var(--intel-blue);
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .intel-btn:hover {
            background: var(--intel-blue);
            color: #000;
            box-shadow: 0 0 15px var(--intel-blue);
        }
        .intel-btn.admin-only {
            border-color: #ff004c;
            color: #ff004c;
            display: none; /* Hidden by default */
        }
        .intel-btn.admin-only:hover { background: #ff004c; color: #fff; }

        /* LOADING STATE */
        #loader {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: #000; z-index: 100;
            display: flex; justify-content: center; align-items: center;
            color: var(--intel-cyan); font-size: 1.2em;
        }

        @keyframes scan { 0% { top: -10%; opacity: 0; } 50% { opacity: 1; } 100% { top: 110%; opacity: 0; } }
        @media(max-width: 768px) { .dossier-frame { grid-template-columns: 1fr; text-align: center; } }
    </style>
</head>
<body>

    <div id="loader"><i class="fas fa-satellite-dish fa-spin"></i> &nbsp; ESTABLISHING SECURE UPLINK...</div>

    <main class="dossier-frame" id="dossier-content" style="opacity: 0;">
        
        <div class="id-sector">
            <div class="avatar-frame">
                <div class="avatar-scan-line"></div>
                <img id="user-avatar" src="images/profile_placeholder.png" alt="Subject">
            </div>
            <div class="rank-badge" id="user-role">UNKNOWN</div>
            
            <div style="font-size: 0.8em; color: var(--intel-cyan);">
                <i class="fas fa-circle"></i> CLEARANCE: <span id="user-status">ACTIVE</span>
            </div>
        </div>

        <div class="data-sector">
            <h1 id="user-name">--</h1>
            <span class="uid-sub">SUBJECT ID: <span id="user-uid">--</span></span>

            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-val" id="stat-missions">0</div>
                    <div class="stat-label">MISSIONS CLEARED</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="stat-rep">0</div>
                    <div class="stat-label">REPUTATION</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="stat-joined">--</div>
                    <div class="stat-label">INDUCTION DATE</div>
                </div>
            </div>

            <div class="bio-box">
                <h4 style="margin-top:0; color:var(--intel-blue); font-size:0.8em;">OPERATIVE BIO</h4>
                <p id="user-bio" style="margin:0;">No biography data found in archives.</p>
            </div>

            <div class="action-bar">
                <button class="intel-btn" onclick="startComms()"><i class="fas fa-comment-alt"></i> OPEN COMMS</button>
                <button class="intel-btn" onclick="copyLink()"><i class="fas fa-link"></i> SHARE INTEL</button>
                
                <button class="intel-btn admin-only" id="btn-freeze" onclick="adminFreeze()">
                    <i class="fas fa-snowflake"></i> FREEZE ASSET
                </button>
            </div>
        </div>

    </main>

    <script type="module">
        import { db, auth, DB_PATH } from './assets/js/firebase-init.js';
        import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

        // 1. GET TARGET FROM URL
        const urlParams = new URLSearchParams(window.location.search);
        const targetUid = urlParams.get('uid');

        // 2. AUTH GUARD & ADMIN CHECK
        onAuthStateChanged(auth, async (currentUser) => {
            if (!currentUser && !targetUid) {
                window.location.href = 'DoD_Login_Style.html';
                return;
            }

            // Check if Viewer is Admin
            if (currentUser) {
                checkAdminClearance(currentUser.uid);
            }

            // If no UID provided, show Current User
            const lookupId = targetUid || (currentUser ? currentUser.uid : null);

            if (lookupId) {
                loadDossier(lookupId);
            } else {
                alert("NO TARGET IDENTIFIED.");
                window.location.href = 'index.html';
            }
        });

        // 3. CHECK ADMIN STATUS
        async function checkAdminClearance(uid) {
            try {
                const docRef = doc(db, `${DB_PATH}/users/${uid}`);
                const snap = await getDoc(docRef);
                if (snap.exists() && snap.data().role === 'admin') {
                    document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                }
            } catch(e) { console.log("Clearance Check Failed"); }
        }

        // 4. LOAD DATA
        async function loadDossier(uid) {
            try {
                const docRef = doc(db, `${DB_PATH}/users/${uid}`);
                const snap = await getDoc(docRef);

                if (snap.exists()) {
                    const data = snap.data();
                    renderIntel(uid, data);
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('dossier-content').style.opacity = '1';
                    document.getElementById('dossier-content').style.transition = 'opacity 1s';
                } else {
                    alert("SUBJECT NOT FOUND IN ARCHIVES.");
                }
            } catch (error) {
                console.error(error);
                alert("SATELLITE UPLINK FAILED.");
            }
        }

        // 5. RENDER UI
        function renderIntel(uid, data) {
            // Identity
            setText('user-name', data.username || data.name || "UNKNOWN SUBJECT");
            setText('user-role', data.role || "CIVILIAN");
            setText('user-uid', uid);
            setText('user-status', data.status || "ACTIVE");

            // Stats
            setText('stat-missions', data.missions_completed || 0);
            setText('stat-rep', data.reputation || 100);
            
            // Date
            if(data.created_at) {
                const date = new Date(data.created_at.seconds * 1000); // Firebase Timestamp
                setText('stat-joined', date.toLocaleDateString());
            } else {
                setText('stat-joined', "CLASSIFIED");
            }

            // Bio
            setText('user-bio', data.bio || "No tactical biography established.");

            // Avatar
            const img = document.getElementById('user-avatar');
            img.src = data.profile_pic || 'images/profile_placeholder.png';
        }

        function setText(id, txt) {
            const el = document.getElementById(id);
            if(el) el.innerText = txt.toString().toUpperCase();
        }

        // 6. BUTTON ACTIONS
        window.startComms = () => {
            // Redirect to Chat with this user pre-selected
            window.location.href = `Admin_Room.html?chat_target=${targetUid || ''}`; 
            // Note: You'll need to upgrade Admin_Room or Chat page to handle this param later
        };

        window.copyLink = () => {
            navigator.clipboard.writeText(window.location.href);
            alert("DOSSIER LINK COPIED TO CLIPBOARD.");
        };

        window.adminFreeze = async () => {
            if(!confirm("WARNING: FREEZE ASSET? This will lock their account.")) return;
            // Logic to update user status to 'FROZEN'
            const ref = doc(db, `${DB_PATH}/users/${targetUid}`);
            await updateDoc(ref, { status: 'FROZEN', is_banned: true });
            alert("ASSET FROZEN.");
            location.reload();
        };

    </script>
</body>
</html>
