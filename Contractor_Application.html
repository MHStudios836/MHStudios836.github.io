<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>MH STUDIOS | CORPORATE PARTNERSHIP</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="icon" type="image/x-icon" href="images/Logo_1.png">
    
    <style>
        /* ================================================================
           TITAN GOLD THEME (CONTRACTOR CLASS)
        ================================================================ */
        :root {
            --corp-gold: #FFD700;
            --corp-gold-dim: rgba(255, 215, 0, 0.15);
            --corp-dark: #050505;
            --corp-panel: #0b0d10;
            --corp-border: #333;
            --corp-text: #e0e0e0;
            --carbon-fiber: repeating-linear-gradient(
                45deg,
                rgba(0,0,0,0.1),
                rgba(0,0,0,0.1) 10px,
                rgba(0,0,0,0.2) 10px,
                rgba(0,0,0,0.2) 20px
            );
        }

        body {
            background-color: var(--corp-dark);
            color: var(--corp-text);
            font-family: 'Uni Sans', sans-serif;
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; flex-direction: column;
            background-image: 
                radial-gradient(circle at top right, rgba(255, 215, 0, 0.05) 0%, transparent 40%),
                var(--carbon-fiber);
        }

        /* --- HEADER --- */
        #corp-header {
            padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--corp-gold);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
        }
        .brand-title { 
            font-size: 1.2em; letter-spacing: 2px; color: #fff; display: flex; align-items: center; gap: 15px; 
        }
        .brand-title img { height: 40px; }
        .secure-badge {
            font-size: 0.7em; color: var(--corp-gold); border: 1px solid var(--corp-gold);
            padding: 5px 10px; border-radius: 4px; letter-spacing: 1px;
        }

        /* --- MAIN CONTAINER --- */
        .enlistment-wrapper {
            flex: 1;
            max-width: 900px;
            margin: 40px auto;
            width: 95%;
        }

        /* --- PROGRESS BAR --- */
        .progress-track {
            display: flex; justify-content: space-between; margin-bottom: 40px; position: relative;
        }
        .progress-track::before {
            content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: #333; z-index: 0;
        }
        .step-node {
            width: 40px; height: 40px; background: #111; border: 2px solid #333;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 1; transition: 0.3s;
            font-weight: bold; color: #555;
        }
        .step-node.active {
            border-color: var(--corp-gold); color: var(--corp-gold);
            box-shadow: 0 0 15px var(--corp-gold-dim);
        }
        .step-node.complete {
            background: var(--corp-gold); border-color: var(--corp-gold); color: #000;
        }

        /* --- FORMS --- */
        .corp-panel {
            background: var(--corp-panel);
            border: 1px solid var(--corp-border);
            border-left: 4px solid var(--corp-gold);
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none; /* Hidden by default */
            animation: slideIn 0.4s ease-out;
        }
        .corp-panel.active { display: block; }

        h2.panel-title {
            margin-top: 0; color: #fff; border-bottom: 1px solid #333; padding-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* INPUTS */
        .titan-input-group { margin-bottom: 25px; }
        .titan-label { display: block; margin-bottom: 8px; font-size: 0.8em; color: var(--corp-gold); letter-spacing: 1px; }
        .titan-input {
            width: 100%; padding: 12px; background: #000; border: 1px solid #333;
            color: #fff; font-family: 'Courier New', monospace; outline: none; transition: 0.3s;
        }
        .titan-input:focus { border-color: var(--corp-gold); box-shadow: 0 0 10px var(--corp-gold-dim); }

        /* FILE UPLOAD */
        .upload-zone {
            border: 2px dashed #444; padding: 30px; text-align: center;
            cursor: pointer; transition: 0.3s; background: rgba(0,0,0,0.3);
        }
        .upload-zone:hover { border-color: var(--corp-gold); background: rgba(255, 215, 0, 0.05); }

        /* NAV BUTTONS */
        .nav-row { display: flex; justify-content: space-between; margin-top: 30px; }
        .btn-corp {
            padding: 12px 30px; background: transparent; border: 1px solid var(--corp-gold);
            color: var(--corp-gold); font-weight: bold; cursor: pointer; letter-spacing: 2px;
            transition: 0.3s; text-transform: uppercase;
        }
        .btn-corp:hover { background: var(--corp-gold); color: #000; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* MOBILE */
        @media screen and (max-width: 768px) {
            #corp-header { padding: 15px 20px; }
        }
    </style>
</head>
<body>

    <header id="corp-header">
        <div class="brand-title">
            <img src="images/Logo_1.png" alt="MH">
            <span>MH<span style="color:var(--corp-gold)">//</span>PARTNERS</span>
        </div>
        <div class="secure-badge"><i class="fas fa-building"></i> B2B PORTAL</div>
    </header>

    <div class="enlistment-wrapper">
        
        <div class="progress-track">
            <div class="step-node active" id="node-1">1</div>
            <div class="step-node" id="node-2">2</div>
            <div class="step-node" id="node-3">3</div>
        </div>

        <form id="contractor-form">
            
            <div class="corp-panel active" id="step-1">
                <h2 class="panel-title">REPRESENTATIVE IDENTITY <i class="fas fa-id-badge"></i></h2>
                
                <div class="titan-input-group">
                    <label class="titan-label">FULL NAME (REPRESENTATIVE)</label>
                    <input type="text" id="rep-name" class="titan-input" placeholder="JOHN DOE" required>
                </div>

                <div class="titan-input-group">
                    <label class="titan-label">CORPORATE EMAIL</label>
                    <input type="email" id="rep-email" class="titan-input" placeholder="NAME@COMPANY.COM" required>
                </div>

                <div class="titan-input-group">
                    <label class="titan-label">DIRECT PHONE LINE</label>
                    <input type="tel" id="rep-phone" class="titan-input" placeholder="+962 7X XXX XXXX" required>
                </div>

                <div class="titan-input-group">
                    <label class="titan-label">POSITION / JOB TITLE</label>
                    <input type="text" id="rep-title" class="titan-input" placeholder="e.g. PROJECT MANAGER" required>
                </div>

                <div class="nav-row" style="justify-content: flex-end;">
                    <button type="button" class="btn-corp" onclick="nextStep(1)">NEXT: COMPANY DATA <i class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="corp-panel" id="step-2">
                <h2 class="panel-title">COMPANY PROFILE <i class="fas fa-building"></i></h2>
                
                <div class="titan-input-group">
                    <label class="titan-label">REGISTERED COMPANY NAME</label>
                    <input type="text" id="comp-name" class="titan-input" placeholder="e.g. ACME GLOBAL LTD." required>
                </div>

                <div class="titan-input-group">
                    <label class="titan-label">HEADQUARTERS LOCATION</label>
                    <input type="text" id="comp-hq" class="titan-input" placeholder="CITY, COUNTRY" required>
                </div>

                <div class="titan-input-group">
                    <label class="titan-label">INDUSTRY SECTOR</label>
                    <input type="text" id="comp-industry" class="titan-input" placeholder="e.g. TECHNOLOGY, CONSTRUCTION, FINANCE" required>
                </div>
                
                <div class="titan-input-group">
                    <label class="titan-label">COMPANY WEBSITE</label>
                    <input type="url" id="comp-web" class="titan-input" placeholder="HTTPS://" required>
                </div>

                <div class="titan-input-group">
                    <label class="titan-label">ESTIMATED ANNUAL BUDGET FOR OUTSOURCING ($)</label>
                    <input type="number" id="comp-budget" class="titan-input" placeholder="100000" min="1000">
                </div>

                <div class="nav-row">
                    <button type="button" class="btn-corp" onclick="prevStep(2)"><i class="fas fa-chevron-left"></i> BACK</button>
                    <button type="button" class="btn-corp" onclick="nextStep(2)">NEXT: VERIFICATION <i class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="corp-panel" id="step-3">
                <h2 class="panel-title">VERIFICATION DOCS <i class="fas fa-file-signature"></i></h2>
                
                <div class="titan-input-group">
                    <label class="titan-label">UPLOAD COMMERCIAL REGISTRATION (CR) / TAX ID</label>
                    <input type="file" id="comp-docs" class="titan-input" accept="image/*,application/pdf" hidden onchange="updateFileName(this)">
                    <div class="upload-zone" onclick="document.getElementById('comp-docs').click()">
                        <i class="fas fa-briefcase" style="font-size:2em; color:#666;"></i>
                        <p id="file-name-display" style="margin:10px 0 0 0; font-size:0.9em;">CLICK TO UPLOAD BUSINESS LICENSE</p>
                    </div>
                </div>

                <div class="titan-input-group">
                    <label class="titan-label">BILLING PREFERENCE</label>
                    <select id="comp-billing" class="titan-input">
                        <option value="INVOICE">MONTHLY INVOICE</option>
                        <option value="PREPAID">PREPAID ACCOUNT (ESCROW)</option>
                        <option value="CORPORATE_CARD">CORPORATE CREDIT CARD</option>
                    </select>
                </div>

                <div class="nav-row">
                    <button type="button" class="btn-corp" onclick="prevStep(3)"><i class="fas fa-chevron-left"></i> BACK</button>
                    <button type="submit" id="btn-submit-corp" class="btn-corp" style="background:var(--corp-gold); color:#000;">
                        <i class="fas fa-check-circle"></i> ESTABLISH PARTNERSHIP
                    </button>
                </div>
            </div>

        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
        import { getFirestore, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-storage.js";
		import { generateTitanID } from './assets/js/id-generator.js';

        // FIREBASE INIT
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "mhstudios-836.firebaseapp.com",
            projectId: "mhstudios-836",
            storageBucket: "mhstudios-836.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        
        let currentUid = "";

        // 1. AUTH CHECK
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUid = user.uid;
                console.log("CORPORATE ID DETECTED:", currentUid);
            } else {
                window.location.href = "DoD_Login_Style.html";
            }
        });

        // 2. NAVIGATION LOGIC
        window.nextStep = (current) => {
            document.getElementById(`step-${current}`).classList.remove('active');
            document.getElementById(`step-${current+1}`).classList.add('active');
            document.getElementById(`node-${current}`).classList.add('complete');
            document.getElementById(`node-${current+1}`).classList.add('active');
        };

        window.prevStep = (current) => {
            document.getElementById(`step-${current}`).classList.remove('active');
            document.getElementById(`step-${current-1}`).classList.add('active');
            document.getElementById(`node-${current}`).classList.remove('active');
            document.getElementById(`node-${current-1}`).classList.remove('complete');
        };

        window.updateFileName = (input) => {
            if (input.files && input.files[0]) {
                document.getElementById('file-name-display').innerText = "ATTACHED: " + input.files[0].name;
                document.querySelector('.upload-zone').style.borderColor = "#00ff41";
            }
        };

        // 3. SUBMISSION LOGIC
        document.getElementById('btn-submit-corp').addEventListener('click', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-corp');
            btn.innerHTML = '<i class="fas fa-sync fa-spin"></i> SECURING AGREEMENT...';
            btn.disabled = true;
			
			const idPayload = {
            role: 'contractor',
            gender: 'Male', // Default for Corp Entity or add a dropdown if needed
            nationality: 'Jordan', // Default or extract from HQ location
            university: 'Corporate', // Special flag for ID generator
            education_level: 'N/A'
            };
			
			const newSerial = generateTitanID(idPayload);
                console.log("GENERATED CONTRACTOR ID:", newSerial);

                // C. GATHER PROFILE DATA
                const contractorProfile = {
                role: 'contractor',
                tier: 'CORPORATE',
                status: 'PENDING_VERIFICATION',
                    
                // Rep Details
                first_name: document.getElementById('rep-name').value.split(" ")[0],
                last_name: document.getElementById('rep-name').value.split(" ")[1] || "",
                phone: document.getElementById('rep-phone').value,
                job_title: document.getElementById('rep-title').value,
                    
                // Company Details
                company_name: document.getElementById('comp-name').value,
                company_hq: document.getElementById('comp-hq').value,
                industry: document.getElementById('comp-industry').value,
                website: document.getElementById('comp-web').value,
                est_budget: document.getElementById('comp-budget').value,
                billing_method: document.getElementById('comp-billing').value,
                    
                // Meta
                verification_doc: docUrl,
                titanId: newSerial, // <--- SAVING THE REAL ID
                updated_at: serverTimestamp()
                };

                // D. UPDATE DB
                const userRef = doc(db, "users", currentUid);
                await updateDoc(userRef, contractorProfile);

            try {
                // A. UPLOAD FILE (If exists)
                let docUrl = "";
                const fileInput = document.getElementById('comp-docs');
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const storageRef = ref(storage, `corporate_docs/${currentUid}/${file.name}`);
                    await uploadBytes(storageRef, file);
                    docUrl = await getDownloadURL(storageRef);
                }

                // B. GATHER DATA
                const contractorProfile = {
                    role: 'contractor', // Forces the role change
                    tier: 'CORPORATE',
                    status: 'PENDING_VERIFICATION', // Admin must approve High Value Clients
                    
                    // Rep Details
                    first_name: document.getElementById('rep-name').value.split(" ")[0],
                    last_name: document.getElementById('rep-name').value.split(" ")[1] || "",
                    phone: document.getElementById('rep-phone').value,
                    job_title: document.getElementById('rep-title').value,
                    
                    // Company Details
                    company_name: document.getElementById('comp-name').value,
                    company_hq: document.getElementById('comp-hq').value,
                    industry: document.getElementById('comp-industry').value,
                    website: document.getElementById('comp-web').value,
                    est_budget: document.getElementById('comp-budget').value,
                    billing_method: document.getElementById('comp-billing').value,
                    
                    // Meta
                    verification_doc: docUrl,
                    titanId: "CON-" + Date.now().toString().slice(-6), // Temp ID
                    updated_at: serverTimestamp()
                };

                // C. UPDATE DB
                const userRef = doc(db, "users", currentUid);
                await updateDoc(userRef, contractorProfile);

                // D. SUCCESS
                alert("AGREEMENT SUBMITTED.\n\nMH STUDIOS COMMAND WILL REVIEW YOUR CORPORATE CREDENTIALS.\nEXPECT CONTACT WITHIN 24 HOURS.");
                window.location.href = "index.html"; // Or a 'Pending' page

            } catch (error) {
                console.error("CORPORATE SYNC ERROR:", error);
                btn.innerText = "RETRY SUBMISSION";
                btn.disabled = false;
                alert("SYSTEM ERROR: " + error.message);
            }
        });
    </script>
</body>
</html>
